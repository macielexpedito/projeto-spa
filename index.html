<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>6 Desafios</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header><h1>Painel de Ferramentas</h1></header>
    <main>
        <aside>
            <button id="moeda">Conversor de Moedas</button>
            <button id="imc">Cálculo de IMC por Gênero</button>
            <button id="temperatura">Conversor de Temperatura</button>
            <button id="velocidade">Conversor de Velocidade</button>
            <button id="massa">Conversor de Massa</button>
            <button id="regraDeTres">Regra de Três</button>
        </aside>
        <div>
            <section class="painel">
                <h2>Conversor de Moeda</h2>
                <input type="number" id="valor" placeholder="Valor em Reais">
                 <select id="tipo">
                <option value = "usd"> USD -> BRL</option>
                <option value = "brl"> BRL -> USD</option>
                </select>
        <button id="converter">Converter</button>
        <p class="resultado"></p>
            </section>
            <section class="painel">
                <h2>IMC</h2>
                <form action="">             
                <input type="number" id="peso" placeholder="Peso">            
                <input type="number" id="altura" placeholder="Altura"> 
                <select id="genero">
                <option value="homem">Homem</option>
                <option value="mulher">Mulher</option>
                </select>  
                </form>             
                <button id="calcular">Calcular</button>         
                <p class="resultado"></p>
            </section>
            <section class="painel">
                <form action="">
                <h2>Temperatura</h2>
                <input type="number" id="temp" placeholder="Inserir temperatura">
                <button id="converterTemp">Converter</button>
                <select id="tipoTemp">
                <option value="celsius">Celsius -> Fahrenheit</option>
                <option value="fahrenheit">Fahrenheit -> Celsius</option>
                </select>
                </form>
                <p class="resultado"></p>
            </section>
            <section class="painel">
                <form action="">
                <h2>Velocidade</h2>
                <input type="number" id="km">
                <button id="converterVel">Converter</button> 
                <select id="tipoVel">
                <option value="kmhToMs">Km/h -> m/s</option>
                <option value="msToKmh">m/s -> Km/h</option>
                </select>
                </form>       
                <p class="resultado"></p>
                
            </section>
            <section class="painel">
                <form action="">
                <h2>Massa</h2>
                <input type="number" id="Peso">
                <button id="converterPeso">Converter</button>
                <select id="tipoPeso">
                <option value="kgToLb">Kg -> Lb</option>
                <option value="lbToKg">Lb -> Kg</option>
                </select>
                </form>
                <p class="resultado"></p>
            </section>
            <section class="painel">
                <h2>Regra de 3</h2>
                <input type="number" id="a" placeholder="A">
                <input type="number" id="b" placeholder="B">
                <input type="number" id="c" placeholder="C">
                <button id="calcularRegra">Calcular</button>
                <p class="resultado"></p>
            </section>
        </div>
    </main>
    <footer><h1>Footer</h1></footer>
</body>
</html>
